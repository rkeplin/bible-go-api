# MariaDB - bible text data is baked into the rkeplin/bible-mariadb:v3 image
# via /docker-entrypoint-initdb.d, which runs against the (empty) PVC on
# first mount exactly as it would against any empty datadir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bible-db-data
  namespace: bible
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bible-db
  namespace: bible
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bible-db
  template:
    metadata:
      labels:
        app: bible-db
    spec:
      containers:
        - name: mariadb
          image: rkeplin/bible-mariadb:v3
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bible-env
                  key: BIBLE_DB_ROOT_PASS
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: bible-env
                  key: BIBLE_DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: bible-env
                  key: BIBLE_DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bible-env
                  key: BIBLE_DB_PASS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: bible-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: bible-db
  namespace: bible
spec:
  selector:
    app: bible-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
